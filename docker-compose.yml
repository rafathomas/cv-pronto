services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: cvpronto-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    environment:
      - APP_ENV=${APP_ENV:-local}
    depends_on:
      - pgsql
    networks:
      - cvpronto

  nginx:
    image: nginx:1.27-alpine
    container_name: cvpronto-nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - cvpronto

  pgsql:
    image: postgres:16-alpine
    container_name: cvpronto-pgsql
    restart: unless-stopped
    ports:
      - "${FORWARD_DB_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${DB_DATABASE:-cvpronto}
      POSTGRES_USER: ${DB_USERNAME:-cvpronto}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - cvpronto-pgsql-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-q", "-d", "${DB_DATABASE:-cvpronto}", "-U", "${DB_USERNAME:-cvpronto}"]
      retries: 5
      timeout: 5s
    networks:
      - cvpronto

  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: cvpronto-queue
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan queue:work --tries=3 --backoff=5
    volumes:
      - ./:/var/www/html
    depends_on:
      - pgsql
    networks:
      - cvpronto

networks:
  cvpronto:
    driver: bridge

volumes:
  cvpronto-pgsql-data:
    driver: local
